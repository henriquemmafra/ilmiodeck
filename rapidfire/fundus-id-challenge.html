<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fundus ID Challenge · RapidFire</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1420;color:#eef4ff;font:15px system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:20px}a{color:#9fd9e8}h1{font-size:clamp(25px,5vw,37px);margin:12px 0}header p{color:#afc0d3}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.chip{font-size:12px;color:#f6bd87;border:1px solid #805a40;border-radius:20px;padding:6px 10px}.card{background:#182638;border:1px solid #3c526a;border-radius:20px;padding:18px;margin-top:16px}.fundus{display:flex;justify-content:center;align-items:center;background:#101a28;border-radius:16px;padding:12px;min-height:290px}.fundus svg{width:min(100%,340px);height:auto;filter:drop-shadow(0 10px 18px #0008)}.answers{display:grid;gap:10px;margin-top:16px}button{background:#273b52;border:1px solid #59738c;color:#f3f7ff;padding:14px;border-radius:12px;text-align:left;font:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.85}button.correct{background:#164a40;border-color:#54d7ae}button.wrong{background:#5c2931;border-color:#f58b8e}.feedback{border-top:1px solid #42576c;margin-top:16px;padding-top:12px}.feedback p{line-height:1.5;color:#d5e2f1}.feedback b{color:#fff}.next{background:#a75e35;border-color:#f6a76f;font-weight:700;text-align:center;width:100%;margin-top:12px}.muted{color:#b6c7d8;font-size:12px}.bar{height:7px;background:#2b3b4d;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#efa66d;transition:width .3s}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:13px;padding:9px 12px}@media(max-width:600px){main{padding:12px}.card{padding:12px}.fundus{min-height:240px}}</style></head><body><main><header><div class="top"><a href="./index.html">← RapidFire</a><span class="chip">USMLE Step 1 · Ophthalmology</span></div><h1>Fundus <span style="color:#ffad73">ID Challenge</span></h1><p>Identify the retinal finding. Three choices, instant feedback, and explanations for every alternative.</p></header><div class="top"><strong id="counter">Question 1 / 12</strong><span id="score">0 correct</span></div><div class="bar"><span id="progress"></span></div><div class="card"><div class="fundus" id="image" role="img" aria-label="Schematic fundus image"></div><p class="muted">Educational schematic, not a clinical fundus photograph.</p><h2 style="font-size:18px">Which diagnosis best matches this fundus?</h2><div class="answers" id="answers"></div><div id="feedback" aria-live="polite"></div></div><div class="actions"><button id="shuffle">Shuffle questions</button><button id="restart">Restart</button></div></main><script>
const conditions=[
{id:'diabetes',name:'Diabetic retinopathy',clue:'Microaneurysms, dot-blot hemorrhages and hard exudates.',mechanism:'Hyperglycemia causes pericyte loss, capillary damage and ischemia; VEGF drives neovascularization.'},
{id:'hypertension',name:'Hypertensive retinopathy',clue:'Arteriolar narrowing, arteriovenous nicking and flame hemorrhages.',mechanism:'Chronic hypertension causes arteriolosclerosis; severe hypertension can cause cotton-wool spots and optic disc edema.'},
{id:'papilledema',name:'Papilledema',clue:'Swollen optic disc with blurred margins.',mechanism:'Raised intracranial pressure impairs axoplasmic transport in the optic nerve.'},
{id:'crao',name:'Central retinal artery occlusion',clue:'Pale retina with a cherry-red spot.',mechanism:'Inner retinal ischemia whitens the retina while the thin fovea reveals the underlying choroidal circulation.'},
{id:'crvo',name:'Central retinal vein occlusion',clue:'Blood-and-thunder retina with widespread hemorrhages and dilated tortuous veins.',mechanism:'Impaired venous outflow causes congestion, hemorrhage and edema.'},
{id:'amd',name:'Age-related macular degeneration',clue:'Yellow drusen concentrated in the macula.',mechanism:'Deposits between retinal pigment epithelium and Bruch membrane; wet disease involves choroidal neovascularization.'},
{id:'cmv',name:'Cytomegalovirus retinitis',clue:'Hemorrhagic necrotizing retinitis with white retinal lesions.',mechanism:'Opportunistic CMV infection in severe immunosuppression causes retinal necrosis.'},
{id:'rp',name:'Retinitis pigmentosa',clue:'Peripheral bone-spicule pigmentation and attenuated retinal vessels.',mechanism:'Inherited photoreceptor degeneration, often rods first, causes night blindness and progressive peripheral field loss.'},
{id:'glaucoma',name:'Glaucoma',clue:'Enlarged optic cup with thinning of the neuroretinal rim.',mechanism:'Retinal ganglion cell axonal loss leads to progressive optic nerve cupping and visual field defects.'},
{id:'detachment',name:'Retinal detachment',clue:'Elevated, folded gray retina separated from underlying tissue.',mechanism:'Separation of neurosensory retina from retinal pigment epithelium; flashes, floaters and curtain-like visual loss.'},
{id:'roth',name:'Roth spots',clue:'White-centered retinal hemorrhages.',mechanism:'Retinal hemorrhages with pale centers; classically associated with infective endocarditis but not specific.'},
{id:'hollenhorst',name:'Hollenhorst plaque',clue:'Bright refractile yellow cholesterol embolus within a retinal arteriole.',mechanism:'Cholesterol embolization, often from carotid atherosclerotic plaque.'}
];
const ns='http://www.w3.org/2000/svg';function el(tag,attrs={}){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}
function fundus(type){let svg=el('svg',{viewBox:'0 0 400 400','aria-hidden':'true'});let defs=el('defs');let grad=el('radialGradient',{id:'retina'});[['0%','#eaa36d'],['65%','#b75b43'],['100%','#5e1d26']].forEach(([offset,color])=>grad.appendChild(el('stop',{offset,'stop-color':color})));defs.appendChild(grad);svg.appendChild(defs);svg.appendChild(el('circle',{cx:200,cy:200,r:190,fill:'url(#retina)',stroke:'#3b1b21','stroke-width':7}));const g=el('g');svg.appendChild(g);function circle(x,y,r,fill,extra={}){g.appendChild(el('circle',{cx:x,cy:y,r,fill,...extra}))}function path(d,color='#7f2833',w=5,extra={}){g.appendChild(el('path',{d,fill:'none',stroke:color,'stroke-width':w,'stroke-linecap':'round',...extra}))}function spot(x,y,r=5,color='#7c1829'){circle(x,y,r,color)}function disc(x=120,y=195,r=32){circle(x,y,r,'#f5c98c',{opacity:.95});circle(x-4,y-3,r*.7,'#ffe2a9',{opacity:.7})}
disc();const vessels=[['M120 194 C170 170 208 116 335 94',7],['M120 194 C171 217 228 269 335 316',8],['M120 194 C165 201 250 175 358 193',5],['M120 194 C155 144 156 86 209 39',5],['M120 194 C149 254 155 303 203 357',5],['M185 160 Q230 130 265 137',3],['M190 225 Q244 238 287 275',3]];vessels.forEach(([d,w])=>path(d,'#8c2b34',w));circle(264,200,22,'#9a3d3b',{opacity:.35});
if(type==='diabetes'){[[215,110],[286,130],[308,231],[200,275],[150,250],[255,303],[325,170]].forEach(([x,y])=>spot(x,y,6));[[230,175],[280,220],[255,250],[320,260],[191,145]].forEach(([x,y])=>spot(x,y,4,'#f8d477'));[[220,188],[270,165],[320,205]].forEach(([x,y])=>{path('M'+(x-10)+' '+y+'l20 -5','#f4d999',3)})}
if(type==='hypertension'){[[200,140],[260,210],[290,265]].forEach(([x,y])=>{path('M'+x+' '+(y-15)+'q-6 15 0 30','#d23641',8)});path('M120 194 C170 170 208 116 335 94','#d2a28a',3);circle(247,171,6,'#f4d9aa')}
if(type==='papilledema'){circle(120,195,54,'#e5b08d',{opacity:.85});circle(120,195,42,'#ffddaf',{opacity:.7});for(let i=0;i<12;i++){let a=i*Math.PI/6;circle(120+48*Math.cos(a),195+48*Math.sin(a),6,'#f1c3a2',{opacity:.8})}path('M84 150q-17 -9 -16 -22','#9b2935',5)}
if(type==='crao'){circle(200,200,181,'#ead3b8',{opacity:.7});disc();circle(263,201,22,'#b11d32');circle(263,201,12,'#d42c39')}
if(type==='crvo'){for(let i=0;i<48;i++){let a=i*2.399,r=45+Math.sqrt(i/48)*125,x=200+Math.cos(a)*r,y=200+Math.sin(a)*r;path('M'+x+' '+(y-9)+'q'+(i%2?8:-8)+' 8 0 19','#9b172b',4+(i%3)*2)}vessels.forEach(([d,w])=>path(d,'#74202b',w+5))}
if(type==='amd'){for(let i=0;i<26;i++){let a=i*2.4,r=9+Math.sqrt(i/26)*62;circle(265+Math.cos(a)*r,200+Math.sin(a)*r,3+i%4,'#e8d28d',{opacity:.9})}}
if(type==='cmv'){for(let i=0;i<7;i++){let a=i*1.7;circle(200+Math.cos(a)*85,200+Math.sin(a)*85,18+i%3*5,'#e9dfc7',{opacity:.83})}for(let i=0;i<20;i++){let a=i*2.5;spot(200+Math.cos(a)*115,200+Math.sin(a)*115,4+i%5)}}
if(type==='rp'){for(let i=0;i<22;i++){let a=i*2.4,r=105+i%4*14,x=200+Math.cos(a)*r,y=200+Math.sin(a)*r;path('M'+(x-7)+' '+(y-6)+'l7 6 -7 7 M'+x+' '+y+'l9 -8','#321b29',4)}}
if(type==='glaucoma'){circle(120,195,34,'#e9c58f');circle(120,195,28,'#e1e0c8');circle(120,195,21,'#d8d5b8');circle(120,195,9,'#c8c8b0')}
if(type==='detachment'){g.appendChild(el('path',{d:'M198 75 Q350 70 357 215 Q312 155 262 214 Q205 260 164 337 Q187 232 198 75',fill:'#c5c9b5',opacity:.83,stroke:'#f3e9d4','stroke-width':3}));path('M198 75 Q248 143 262 214 Q294 262 341 280','#b4b6a3',4)}
if(type==='roth'){[[220,120],[300,190],[230,286],[164,275]].forEach(([x,y])=>{circle(x,y,14,'#9e1c2d');circle(x,y,5,'#f5e8cf')})}
if(type==='hollenhorst'){path('M120 194 C170 170 208 116 335 94','#8b2835',7);g.appendChild(el('path',{d:'M225 125l16 -5 6 6 -16 7z',fill:'#ffef91',stroke:'#fff8cb','stroke-width':2}))}
return svg}
let order=[],index=0,correct=0,answered=false;const image=document.getElementById('image'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback');
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle([...conditions]);index=0;correct=0;show()}
function show(){answered=false;feedback.replaceChildren();answers.replaceChildren();if(index>=order.length){image.textContent='Review complete';document.querySelector('h2').textContent='Session finished';document.getElementById('counter').textContent='Completed';document.getElementById('score').textContent=correct+' / '+order.length;return}const q=order[index];image.replaceChildren(fundus(q.id));document.getElementById('counter').textContent='Question '+(index+1)+' / '+order.length;document.getElementById('score').textContent=correct+' correct';document.getElementById('progress').style.width=(index/order.length*100)+'%';const wrong=shuffle(conditions.filter(x=>x.id!==q.id)).slice(0,2);shuffle([q,...wrong]).forEach((o,i)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+o.name;b.onclick=()=>choose(o,q);b.dataset.id=o.id;answers.appendChild(b)})}
function choose(pick,q){if(answered)return;answered=true;if(pick.id===q.id)correct++;answers.querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.dataset.id===q.id)b.classList.add('correct');else if(b.dataset.id===pick.id)b.classList.add('wrong')});document.getElementById('score').textContent=correct+' correct';let h=document.createElement('h3');h.textContent=pick.id===q.id?'Correct':'Incorrect · '+q.name;feedback.appendChild(h);let p=document.createElement('p');p.innerHTML='<b>Key finding:</b> '+q.clue+'<br><b>Mechanism:</b> '+q.mechanism;feedback.appendChild(p);answers.querySelectorAll('button').forEach(b=>{let o=conditions.find(x=>x.id===b.dataset.id),t=document.createElement('p');let strong=document.createElement('b');strong.textContent=o.name+': ';t.appendChild(strong);t.appendChild(document.createTextNode(o.id===q.id?'Correct — '+o.clue:'Not this image — '+o.clue));feedback.appendChild(t)});let next=document.createElement('button');next.className='next';next.textContent=index===order.length-1?'See final score':'Next image →';next.onclick=()=>{index++;show()};feedback.appendChild(next)}
document.getElementById('shuffle').onclick=start;document.getElementById('restart').onclick=start;document.addEventListener('keydown',e=>{if(answered){if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();feedback.querySelector('.next')?.click()}}else if(['1','2','3'].includes(e.key))answers.children[Number(e.key)-1]?.click()});start();
</script></body></html>
