<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gram-positive cocci · 3D ID Atlas · RapidFire</title>
<meta name="description" content="3D identification tree for Gram-positive cocci: catalase, coagulase, novobiocin, hemolysis, bacitracin, optochin, CAMP, bile esculin and 6.5% NaCl.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500;1,8..60,600&display=swap">
<style>
[hidden]{display:none!important}
:root{
  color-scheme:dark;
  --bg:#06122a; --panel:rgba(8,20,44,.86); --panel-solid:#0a1a38; --line:#26446f;
  --ink:#eaf0f9; --ink-2:#aebfda; --ink-3:#7891b5; --ivory:#f2ead3; --ivory-ink:#0b1a36;
  --gp:#a77cf0; --pos:#5ef08f; --neg:#ff6b6b; --amber:#f0b46a;
  --f-display:"Source Serif 4",Georgia,serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-label:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pw:min(420px,36vw);
}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#gl:active{cursor:grabbing}
#gl.hot{cursor:pointer}
#dim{position:absolute;inset:0;pointer-events:none;background:rgba(2,8,20,.45);opacity:0;transition:opacity .45s}
#dim.on{opacity:1}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.lab{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;
  font:600 13px/1.15 var(--f-label);color:var(--ink);white-space:nowrap;text-align:center;
  background:rgba(6,16,36,.9);border:1px solid #2b4a7c;border-radius:6px;padding:5px 9px;will-change:transform,opacity}
.lab small{display:block;font:400 11px/1.25 var(--f-ui);color:var(--ink-2);margin-top:2px}
.lab.sp{font:600 italic 15px/1.1 var(--f-display);border-left:3px solid var(--gp);padding:6px 11px}
.lab.test{border-left:3px solid var(--amber)}
.lab.root{border-left:3px solid var(--gp);font-size:14px}
.lab.compact small,.lab.compact .more{display:none}
.lab.compact{padding:3px 7px}
.lab.sel{border-color:var(--ivory);box-shadow:0 0 0 3px rgba(242,234,211,.16)}
.lab .more{display:inline-block;margin-left:6px;font:500 11px/1 var(--f-mono);color:var(--ivory);opacity:.8}
.chip{position:absolute;left:0;top:0;pointer-events:none;cursor:pointer;touch-action:manipulation;white-space:nowrap;font:500 11.5px/1 var(--f-label);letter-spacing:.02em;
  padding:4px 7px;border-radius:999px;background:rgba(6,16,36,.82);border:1px solid #2b4a7c;color:var(--ink-2);will-change:transform,opacity}
.chip.p{color:#bff7cf;border-color:rgba(94,240,143,.5)}
.chip.n{color:#ffc4c4;border-color:rgba(255,107,107,.45)}
.chip.b{color:#ffe1bd;border-color:rgba(240,180,106,.55)}
.chip.a{color:#d6efb3;border-color:rgba(150,200,90,.5)}

.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px 16px;flex-wrap:wrap;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));pointer-events:none}
.top>*{pointer-events:auto}
.back{font:500 12px/1 var(--f-label);letter-spacing:.06em;color:var(--ink-3);text-decoration:none}
.back:hover{color:var(--ink)}
.eyebrow{margin-top:8px;font:500 11px/1.2 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
h1{margin:4px 0 0;font:600 25px/1.05 var(--f-display);letter-spacing:-.01em}
h1 em{font-weight:500;color:var(--ink-2)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 13px;cursor:pointer;font:500 12.5px/1 var(--f-ui);color:var(--ink-2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);white-space:nowrap}
.tb:hover{color:var(--ink);border-color:#3d669f}
.tb[aria-pressed="true"]{background:var(--ivory);color:var(--ivory-ink);border-color:var(--ivory)}

.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));
  font:400 12px/1.3 var(--f-ui);color:var(--ink-3);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.status{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 42px);max-width:min(560px,calc(100% - 32px));
  font:500 12.5px/1.35 var(--f-label);color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;pointer-events:none;opacity:0;transition:opacity .3s}
.status.on{opacity:1}
.status b{color:var(--ivory);font-weight:600}

#panel{position:absolute;top:0;right:0;bottom:0;width:var(--pw);background:rgba(7,18,40,.95);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#panel.on{transform:none}
.pclose{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;z-index:2;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel-solid);cursor:pointer;color:var(--ink)}
.pviewer{position:relative;height:clamp(200px,34vh,300px);flex:none;background:radial-gradient(90% 90% at 50% 40%,#123062,#06122a 80%);border-bottom:1px solid var(--line)}
#pgl{width:100%;height:100%;display:block;touch-action:none}
.phint{position:absolute;left:12px;bottom:9px;font:400 11px/1 var(--f-ui);color:var(--ink-3)}
.pbody{overflow:auto;padding:16px 18px 28px;flex:1;-webkit-overflow-scrolling:touch}
.pbody .ey{font:500 11px/1.2 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.pbody h2{margin:5px 0 2px;font:600 italic 24px/1.1 var(--f-display)}
.pbody .aka{font:400 12px/1.3 var(--f-ui);color:var(--ink-3);margin-bottom:10px}
.pbody h3{margin:16px 0 7px;font:600 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.pbody p{margin:0;line-height:1.5;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:5px 10px;font-size:13px;line-height:1.4}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;color:var(--ink)}
.tests{display:flex;flex-wrap:wrap;gap:6px}
.tst{font:500 12px/1 var(--f-label);padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:#0b1d3f}
.tst i{font-style:normal;font-family:var(--f-mono);margin-left:5px}
.tst.p{border-color:rgba(94,240,143,.5)} .tst.p i{color:var(--pos)}
.tst.n{border-color:rgba(255,107,107,.45)} .tst.n i{color:var(--neg)}
.tst.v i{color:var(--amber)}
ul.hy{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.hy li{position:relative;padding-left:14px;line-height:1.45;color:var(--ink);font-size:13.5px}
ul.hy li{transition:background .4s;border-radius:6px}
ul.hy li.flash{background:rgba(167,124,240,.2)}
ul.hy li::before{content:"";position:absolute;left:2px;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--gp)}
.mn{margin-top:4px;padding:10px 12px;border-radius:8px;background:rgba(242,234,211,.07);border:1px solid rgba(242,234,211,.2);color:var(--ivory);font-size:13px;line-height:1.45}
#drawer{position:absolute;top:0;left:0;bottom:0;width:min(300px,84vw);background:rgba(7,18,40,.96);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:5;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:max(14px,env(safe-area-inset-top)) 14px 10px 18px;font:600 11px/1 var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.dh button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel-solid);cursor:pointer}
#dlist{list-style:none;margin:0;padding:4px 10px 20px;overflow:auto;display:grid;gap:4px}
#dlist .grp{font:600 10.5px/1 var(--f-label);letter-spacing:.14em;color:var(--ink-3);padding:12px 8px 4px}
#dlist button{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer}
#dlist button:hover{background:#0f2550;border-color:var(--line)}
#dlist button.cur{background:rgba(242,234,211,.1);border-color:rgba(242,234,211,.35)}
#dlist b{display:block;font:600 italic 15px/1.15 var(--f-display);color:var(--ink)}
#dlist small{display:block;margin-top:3px;font:400 11.5px/1.3 var(--f-ui);color:var(--ink-3)}
.snav{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:bottom .45s cubic-bezier(.2,.8,.2,1),left .45s cubic-bezier(.2,.8,.2,1);z-index:3}
.snav button{width:38px;height:38px;border-radius:50%;border:0;background:#13305e;color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.snav button:hover{background:#1b3f78}
.snav span{min-width:150px;text-align:center;font:600 italic 14px/1.1 var(--f-display);color:var(--ink);padding:0 6px;cursor:pointer}
.snav span small{display:block;font:400 normal 10.5px/1.2 var(--f-ui);color:var(--ink-3);margin-top:2px}
body.pon .snav{left:calc((100% - var(--pw))/2)}
body.pon .tools{margin-right:var(--pw);transition:margin .45s}
.hint{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 56px)}
.status{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 104px)}
#fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}

@media (max-width:760px){
  h1{font-size:20px} .eyebrow{display:none}
  .tb{padding:7px 10px;font-size:12px}
  .lab{font-size:12px;padding:4px 7px} .lab.sp{font-size:13.5px} .lab small{font-size:10px}
  .chip{font-size:10.5px}
  body.pon .snav{left:50%;bottom:calc(62% + 8px)}
  body.pon .tools{margin-right:0}
  .snav span{min-width:120px;font-size:13px}
  #panel{top:auto;left:0;width:auto;height:62%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(104%)}
  .pviewer{height:clamp(150px,22vh,200px)}
  .hint{font-size:11px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="3D identification tree for Gram-positive cocci"></canvas>
  <div id="dim"></div>
  <div id="labels"></div>
  <header class="top">
    <div class="brand">
      <a class="back" href="./bacterial-atlas.html">← Bacterial ID Atlas</a>
      <div class="eyebrow">Bacterial ID atlas · Staphylococcus · Streptococcus · Enterococcus</div>
      <h1>Gram-positive <em>cocci</em></h1>
    </div>
    <div class="tools">
      <button class="tb" id="bList" aria-expanded="false">☰ Species</button>
      <button class="tb" id="bAll">Show all</button>
      <button class="tb" id="bFocus">Focus branch</button>
      <button class="tb" id="bReset">Reset camera</button>
      <button class="tb" id="bPause" aria-pressed="false">Pause</button>
    </div>
  </header>
  <div class="status" id="status"></div>
  <div class="hint" id="hint">Tap a step or a result to open it · drag to orbit · pinch to zoom</div>
  <div class="snav" id="snav"><button id="sPrev" aria-label="Previous species">‹</button><span id="sName">Species<small>tap ‹ › to browse</small></span><button id="sNext" aria-label="Next species">›</button></div>
  <nav id="drawer" aria-hidden="true" aria-label="Species list"><div class="dh">Species<button id="dClose" aria-label="Close list">✕</button></div><ol id="dlist"></ol></nav>
  <aside id="panel" aria-hidden="true">
    <button class="pclose" id="pClose" aria-label="Close">✕</button>
    <div class="pviewer"><canvas id="pgl"></canvas><span class="phint">drag to rotate</span></div>
    <div class="pbody" id="pbody"></div>
  </aside>
  <div id="fail" hidden><div>3D could not start here (WebGL or the 3D library failed to load).</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./atlas-ill.js"></script>
<script>
window.addEventListener('error',e=>{const f=document.getElementById('fail');if(f){f.hidden=false;f.firstElementChild.textContent='Error: '+(e.message||e);}});
(function(){
'use strict';
const $=s=>document.querySelector(s);
if(!window.THREE||!THREE.OrbitControls){$('#fail').hidden=false;return;}

/* ================= utilities ================= */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x);};
const sm=(a,b,x)=>ease((x-a)/(b-a));
const easeOutBack=x=>{const c=1.5;x=clamp(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const easeIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c;}
function tex(c,srgb=true){const t=new THREE.CanvasTexture(c);if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const FIXED=new WeakSet();
function fixMat(o){const ms=o.material?(Array.isArray(o.material)?o.material:[o.material]):[];ms.forEach(m=>{if(!m||FIXED.has(m)||m.isShaderMaterial)return;FIXED.add(m);if(m.color&&!m.isSpriteMaterial&&!m.isPointsMaterial)m.color.convertSRGBToLinear();if(m.emissive)m.emissive.convertSRGBToLinear();});}
const lin=h=>new THREE.Color(h).convertSRGBToLinear();
const isTouch=matchMedia('(pointer:coarse)').matches;

/* ================= renderer / scene ================= */
const canvas=$('#gl');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){$('#fail').hidden=false;return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

const scene=new THREE.Scene();
scene.background=tex((()=>{const c=cnv(512),g=c.getContext('2d');const gr=g.createRadialGradient(256,200,0,256,256,380);gr.addColorStop(0,'#15386e');gr.addColorStop(.45,'#0a2048');gr.addColorStop(1,'#030a1a');g.fillStyle=gr;g.fillRect(0,0,512,512);return c;})());
scene.fog=new THREE.Fog(0x081a38,70,190);

/* environment for glass / clearcoat reflections */
(function(){
  const es=new THREE.Scene();
  const c=cnv(64,256),g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#3b5a8f');gr.addColorStop(.42,'#12284e');gr.addColorStop(.55,'#0a1a38');gr.addColorStop(1,'#02060f');g.fillStyle=gr;g.fillRect(0,0,64,256);
  es.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.MeshBasicMaterial({map:tex(c),side:THREE.BackSide})));
  const lm=new THREE.MeshBasicMaterial({color:new THREE.Color(1.8,1.8,1.9),side:THREE.DoubleSide});
  [[V(-18,22,10),8,3],[V(20,14,-6),5,10],[V(0,8,26),14,2]].forEach(([p,w,h])=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),lm);m.position.copy(p);m.lookAt(0,0,0);es.add(m);});
  const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(es,.03).texture;
})();

const camera=new THREE.PerspectiveCamera(38,1,.1,500);
camera.position.set(0,2,22);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=3;controls.maxDistance=160;
controls.rotateSpeed=.7;controls.zoomSpeed=.9;controls.screenSpacePanning=true;controls.target.set(0,0,0);

scene.add(new THREE.HemisphereLight(0xb3d0ff,0x0b1a3a,.55));
const key=new THREE.DirectionalLight(0xfff3e0,1.45);key.position.set(8,18,14);scene.add(key);
const rim=new THREE.DirectionalLight(0x5aa9ff,1.0);rim.position.set(-12,6,-14);scene.add(rim);
const warm=new THREE.PointLight(0xffb070,.35,80);warm.position.set(-14,-4,14);scene.add(warm);

/* drifting dust */
(function(){const n=520,p=new Float32Array(n*3),r=rng(7);for(let i=0;i<n;i++){p[i*3]=(r()-.5)*120;p[i*3+1]=(r()-.5)*70-8;p[i*3+2]=(r()-.5)*90-10;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({color:0x9cc0ff,size:.07,transparent:true,opacity:.45,depthWrite:false}));pts.name='dust';scene.add(pts);})();

/* ================= shared textures & materials ================= */
const bumpTex=(()=>{const c=cnv(128),g=c.getContext('2d'),id=g.createImageData(128,128),r=rng(3);for(let i=0;i<128*128;i++){const v=150+r()*80|0;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}g.putImageData(id,0,0);const t=tex(c,false);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,2);return t;})();
const M={
  gp:new THREE.MeshPhysicalMaterial({color:0x6a3fc4,roughness:.42,metalness:0,clearcoat:.55,clearcoatRoughness:.35,bumpMap:bumpTex,bumpScale:.012,envMapIntensity:.9}),
  gpDeep:new THREE.MeshPhysicalMaterial({color:0x5a31ad,roughness:.45,clearcoat:.5,clearcoatRoughness:.35,bumpMap:bumpTex,bumpScale:.014,envMapIntensity:.9}),
  fimb:new THREE.MeshStandardMaterial({color:0xc9b4ff,roughness:.5}),
  glass:new THREE.MeshPhysicalMaterial({color:0xe6f2ff,metalness:0,roughness:.05,transparent:true,opacity:.2,clearcoat:1,clearcoatRoughness:.05,envMapIntensity:1.6,side:THREE.DoubleSide,depthWrite:false}),
  glassRim:new THREE.MeshPhysicalMaterial({color:0xf2f8ff,roughness:.05,transparent:true,opacity:.55,clearcoat:1,envMapIntensity:2,depthWrite:false}),
  agarSide:new THREE.MeshStandardMaterial({color:0x5c0812,roughness:.35,transparent:true,opacity:.92}),
  colony:new THREE.MeshPhysicalMaterial({color:0xe7e1d2,roughness:.25,clearcoat:.8,clearcoatRoughness:.2}),
  colonyGold:new THREE.MeshPhysicalMaterial({color:0xd8961a,roughness:.25,clearcoat:.8,clearcoatRoughness:.2}),
  disk:new THREE.MeshStandardMaterial({color:0xf4f1ea,roughness:.85}),
  rack:new THREE.MeshStandardMaterial({color:0x1a2a47,roughness:.55,metalness:.2}),
  metal:new THREE.MeshStandardMaterial({color:0xc9d2de,roughness:.28,metalness:.9}),
  edge:new THREE.MeshStandardMaterial({color:0x4f6f9c,roughness:.5,metalness:.1,emissive:0x0b1a33}),
  hit:new THREE.MeshBasicMaterial({visible:false}),
};

function fresnel(color,a=.85,b=.05,p=2.2){
  return new THREE.ShaderMaterial({uniforms:{c:{value:new THREE.Color(color)},a:{value:a},b:{value:b},p:{value:p}},
    vertexShader:'varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
    fragmentShader:'uniform vec3 c;uniform float a,b,p;varying vec3 vN;varying vec3 vV;void main(){float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),p);gl_FragColor=vec4(c*(.6+.8*f),clamp(b+a*f,0.,1.));}',
    transparent:true,depthWrite:false,side:THREE.FrontSide});
}

function chainOf({n=8,r=.22,stretch=1,amp=.25,freq=1.6,mat=M.gp,seed=1,pairs=true}){
  const g=new THREE.Group(),cells=[],R=rng(seed);
  const path=s=>V(s,amp*Math.sin(s*freq+seed),amp*.7*Math.sin(s*freq*.7+seed*2));
  let s=0;const step=[];for(let i=0;i<n;i++){step.push(s);s+=r*2*stretch*(pairs?(i%2?1.06:.9):.97);}
  const off=s/2-r*stretch;
  for(let i=0;i<n;i++){
    const p=path(step[i]-off),q=path(step[i]-off+.01),t=q.sub(p).normalize();
    const m=new THREE.Mesh(GEO.sph,mat);m.position.copy(p);m.quaternion.setFromUnitVectors(AX,t);
    const flat=pairs?.93:.96;m.scale.set(r*stretch*flat,r*(1+(R()-.5)*.04),r);g.add(m);cells.push({p:p.clone(),t,r});
  }
  return {g,cells};
}
function addFimbriae(g,cells,{per=34,len=.075,seed=5}={}){

  const im=new THREE.InstancedMesh(GEO.hair,M.fimb,list.length),o=new THREE.Object3D();
  list.forEach(([p,d,l],i)=>{o.position.copy(p);o.quaternion.setFromUnitVectors(UP,d);o.scale.set(1,l,1);o.updateMatrix();im.setMatrixAt(i,o.matrix);});

function lancetGeo(R,L){

/* variable-radius tube along a curve (horns, colon) */
function varTube(curve,rf,segs=48,rad=16,colorFn){
  const fr=curve.computeFrenetFrames(segs,false),pos=[],col=[],idx=[];
  for(let i=0;i<=segs;i++){const t=i/segs,P=curve.getPointAt(t),N=fr.normals[i],B=fr.binormals[i],r=rf(t);const cc=colorFn?colorFn(t):null;

const GAP=1.6,LEVEL=6.4;const ROWY=[];

  const mh=[],md=[];Object.values(N).forEach(n=>{if(!isShown(n.id))return;let d=0,p=n.parent;while(p){d++;p=N[p].parent;}mh[d]=Math.max(mh[d]||0,n.H);md[d]=Math.max(md[d]||0,(n.D||.9)-.9);});
  ROWY.length=0;ROWY[0]=0;for(let d=1;d<mh.length;d++)ROWY[d]=ROWY[d-1]-(4.3+(mh[d]||1.5)+(md[d-1]||0));
  measure('root');place('root',0,0);
  Object.values(N).forEach(n=>{const vis=isShown(n.id);if(vis&&n.want===0){n.pos.copy(n.parent?N[n.parent].pos:n.tgt);}n.want=vis?1:0;});}

  const c=box.getCenter(V()),sz=box.getSize(V());
  const fov=camera.fov*Math.PI/180,{w,h,ox,oy}=viewport();
  if(w<2||h<2)return;
  const aspect=Math.max(.2,(w-ox*2)/Math.max(1,h-oy*2));
  const dist=Math.max(sz.y/2/Math.tan(fov/2),sz.x/2/(Math.tan(fov/2)*aspect))*1.12+sz.z/2+2;
  const cur=camera.position.clone().sub(controls.target).normalize();

  flyTo(c,c.clone().addScaledVector(dir,Math.max(dist,6)),dur);

    <h3>Identification</h3><div class="tests">${d.tests.map(([t,v,k])=>`<span class="tst ${k}">${t}<i>${v}</i></span>`).join('')}</div>
    <h3>High-yield · Step 1</h3><ul class="hy">${d.clin.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h3>Don't confuse</h3><p>${d.diff}</p>
    <h3>Mnemonic</h3><div class="mn">${d.mnem}</div>`;
  pbody.scrollTop=0;panelId=id;document.body.classList.add('pon');navIdx=ORDER.indexOf(id);updateNav();panel.classList.add('on');panel.setAttribute('aria-hidden','false');dim.classList.add('on');select(id);
  setTimeout(()=>{resizePV();fitIds([id],900);},60);
}
function closePanel(){if(!panelId)return;panelId=null;document.body.classList.remove('pon');panel.classList.remove('on');panel.setAttribute('aria-hidden','true');dim.classList.remove('on');}
$('#pClose').onclick=closePanel;
/* species navigator: drawer list + prev/next */
const ORDER=[];(function dfs(id){const n=N[id];if(n.species)ORDER.push(id);n.children.forEach(dfs);})('root');
let navIdx=-1;
function pathText(id){const parts=[];let q=id;const ch=[];while(q){ch.unshift(q);q=N[q].parent;}ch.forEach((c,i)=>{if(i>0&&VIA[c])parts.push(VIA[c]);});return parts.join(' → ');}
const GRP={coag:'STAPHYLOCOCCUS',bacit:'STREP · β-HEMOLYTIC',opto:'STREP · α-HEMOLYTIC',bile:'γ-HEMOLYTIC · GROUP D',nacl:'γ-HEMOLYTIC · GROUP D'};
(function(){const ol=$('#dlist');let last='';ORDER.forEach(id=>{let p=N[id].parent;while(p&&!GRP[p])p=N[p].parent;const g=GRP[p]||'';
  if(g!==last){const li=document.createElement('li');li.className='grp';li.textContent=g;ol.appendChild(li);last=g;}
  const li=document.createElement('li'),b=document.createElement('button');b.dataset.id=id;b.innerHTML=`<b>${N[id].title}</b><small>${pathText(id)}</small>`;b.onclick=()=>{toggleDrawer(false);goTo(id);};li.appendChild(b);ol.appendChild(li);});})();
function toggleDrawer(on){const d=$('#drawer');on=on===undefined?!d.classList.contains('on'):on;d.classList.toggle('on',on);d.setAttribute('aria-hidden',!on);$('#bList').setAttribute('aria-expanded',on);}
$('#bList').onclick=()=>toggleDrawer();$('#dClose').onclick=()=>toggleDrawer(false);
function reveal(id){let p=N[id].parent;while(p){N[p].open=true;N[p].children.forEach(k=>{if(N[k].autoOpen)N[k].open=true;});p=N[p].parent;}relayout();}
function goTo(id){hintEl.style.opacity=0;reveal(id);select(id);openPanel(id);}
function updateNav(){const id=ORDER[navIdx];$('#sName').innerHTML=id?`${N[id].title}<small>${navIdx+1} / ${ORDER.length} · ${pathText(id)}</small>`:'Species<small>tap ‹ › to browse</small>';
  document.querySelectorAll('#dlist button').forEach(b=>b.classList.toggle('cur',b.dataset.id===id));}
function step(d){navIdx=navIdx<0?(d>0?0:ORDER.length-1):(navIdx+d+ORDER.length)%ORDER.length;goTo(ORDER[navIdx]);}
$('#sPrev').onclick=()=>step(-1);$('#sNext').onclick=()=>step(1);$('#sName').onclick=()=>toggleDrawer(true);
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});
addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();if(e.key===' '&&e.target===document.body){e.preventDefault();$('#bPause').click();}});
(function(){let sx=0,sy=0;panel.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  panel.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(e.target.closest('#pgl'))return;
    if((!mobile()&&dx>70&&Math.abs(dy)<60)||(mobile()&&dy>80&&pbody.scrollTop<=0&&Math.abs(dx)<70))closePanel();},{passive:true});})();
function resizePV(){if(!pv)return;const w=pv.c.clientWidth,h=pv.c.clientHeight;if(!w||!h)return;pv.r.setSize(w,h,false);pv.cam.aspect=w/h;pv.cam.updateProjectionMatrix();}

/* ================= sizing ================= */
function viewport(){const w=canvas.clientWidth,h=canvas.clientHeight;const pw=panelId?(mobile()?0:panel.offsetWidth):0,ph=panelId&&mobile()?panel.offsetHeight:0;return {w,h,ox:pw/2,oy:ph/2};}
let booted=false;
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(w<2||h<2)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();applyOffset();resizePV();
  if(!booted){booted=true;fitIds(visibleIds(),10);}
  Object.values(N).forEach(n=>{const c=n.el.classList.contains('compact');n.el.classList.remove('compact');n.lw=n.el.offsetWidth;n.lh=n.el.offsetHeight;n.el.classList.add('compact');n.lwC=n.el.offsetWidth;n.lhC=n.el.offsetHeight;n.el.classList.toggle('compact',c);n.cw=n.chipEls.map(e=>e.offsetWidth);});}
function applyOffset(){const w=canvas.clientWidth,h=canvas.clientHeight;if(Math.abs(offX)<.5&&Math.abs(offY)<.5){camera.clearViewOffset();}else camera.setViewOffset(w,h,offX,offY,w,h);}
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(canvas);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(resize);

/* ================= frame loop ================= */
let simT=0,last=performance.now(),texAcc=0;
const tmp=V(),tmp2=V();
function edgeCurve(e){const p=N[e.p],c=N[e.c];
  const a=V(p.pos.x+e.port*p.root.scale.x,p.pos.y-.35,p.pos.z+.2),b=V(c.pos.x,c.pos.y+c.H+1.05,c.pos.z);
  return new THREE.CubicBezierCurve3(a,a.clone().add(V(0,-LEVEL*.38,0)),b.clone().add(V(0,LEVEL*.36,0)),b);}
function frame(now){
  requestAnimationFrame(frame);
  if(!booted){resize();if(!booted)return;}
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused)simT+=dt;
  texAcc+=dt;const tick=texAcc>.066;if(tick)texAcc=0;

  /* panel offset */
  const pw=panelId?(mobile()?0:panel.offsetWidth):0,ph=panelId&&mobile()?panel.offsetHeight:0;
  const tx=pw/2,ty=ph/2;const k=1-Math.exp(-dt*7);
  if(Math.abs(offX-tx)>.3||Math.abs(offY-ty)>.3){offX+=(tx-offX)*k;offY+=(ty-offY)*k;applyOffset();}

  /* camera flight */
  if(flight){const q=easeIO(clamp((now-flight.t0)/flight.dur));controls.target.lerpVectors(flight.ft,flight.tt,q);camera.position.lerpVectors(flight.fp,flight.tp,q);if(q>=1)flight=null;}
  controls.update();

  /* nodes */
  const kk=1-Math.exp(-dt*5.5);
  Object.values(N).forEach(n=>{
    n.vis=n.want>n.vis?Math.min(n.want,n.vis+dt*1.6):Math.max(n.want,n.vis-dt*3);
    if(n.want)n.pos.lerp(n.tgt,kk);else if(n.parent)n.pos.lerp(N[n.parent].pos,kk);
    const s=Math.max(.0001,easeOutBack(n.vis));n.root.scale.setScalar(s);n.root.position.copy(n.pos);n.root.visible=n.vis>.01;
    if(n.root.visible&&n.update)n.update(simT,paused?0:dt,tick&&!paused||n.firstDraw===undefined);
    if(n.root.visible&&n.firstDraw===undefined){n.firstDraw=1;}
  });

  /* edges */
  edges.forEach(e=>{const p=N[e.p],c=N[e.c];const v=Math.min(p.vis,c.vis);const on=v>.02;e.mesh.visible=on;e.dot.visible=on;if(!on)return;
    const key=[p.pos.x,p.pos.y,p.pos.z,c.pos.x,c.pos.y,c.pos.z,p.root.scale.x].map(x=>x.toFixed(3)).join();
    const cv=edgeCurve(e);
    if(key!==e.key){e.key=key;e.mesh.geometry.dispose();e.mesh.geometry=new THREE.TubeGeometry(cv,28,.028,7,false);}
    e.mesh.material.opacity=v;
    const f=((simT*.35)+e.port*.1)%1;e.dot.position.copy(cv.getPointAt(f));e.dot.material.opacity=.7*v*Math.sin(f*Math.PI);});

  /* dust */
  const dust=scene.getObjectByName('dust');if(dust)dust.rotation.y+=dt*.004;

  renderer.render(scene,camera);
  if(panelId&&pv){pv.ctl.update();pv.r.render(pv.s,pv.cam);}

  /* labels */
  const w=canvas.clientWidth,h=canvas.clientHeight,rects=[];
  const camDist=camera.position.distanceTo(controls.target);
  Object.values(N).forEach(n=>{
    const el=n.el;if(n.vis<.05){el.style.opacity=0;el.dataset.op=0;el.style.pointerEvents='none';n.chipEls.forEach(c=>{c.style.opacity=0;c.style.pointerEvents='none';});return;}
    const s=n.root.scale.x;
    tmp.set(n.pos.x,n.pos.y+(n.H+.75)*s,n.pos.z).project(camera);
    const x=(tmp.x*.5+.5)*w,y=(-tmp.y*.5+.5)*h;
    const behind=tmp.z>1;
    const ppu=h/(2*Math.tan(camera.fov*Math.PI/360)*Math.max(1,camera.position.distanceTo(n.pos)));
    const compact=n.W*ppu<(n.lw||120)*1.25&&n.id!==selected;if(compact!==n.compact){n.compact=compact;el.classList.toggle('compact',compact);}
    const lw=(compact?n.lwC:n.lw)||120,lh=(compact?n.lhC:n.lh)||34;
    const r={x:x-lw/2,y:y-lh,w:lw,h:lh,n,el,pri:(n.id===selected?100:0)-n.depth};
    if(!behind)rects.push(r);
    el.style.transform=`translate3d(${(x-lw/2).toFixed(1)}px,${(y-lh).toFixed(1)}px,0)`;
    el.dataset.op=behind?0:clamp(n.vis*1.3);
    n.chipEls.forEach((c,i)=>{tmp2.set(n.pos.x+n.ports[i]*s,n.pos.y-.2*s,n.pos.z+1.1*s).project(camera);
      const cx=(tmp2.x*.5+.5)*w,cy=(-tmp2.y*.5+.5)*h;const cw=(n.cw&&n.cw[i])||80;
      c.style.transform=`translate3d(${(cx-cw/2).toFixed(1)}px,${(cy+4).toFixed(1)}px,0)`;const co=(tmp2.z>1||ppu<30)?0:clamp(n.vis*1.3-.3);c.style.opacity=co;c.style.pointerEvents=(co>.5&&n.children[i])?'auto':'none';});
  });
  rects.sort((a,b)=>b.pri-a.pri);
  for(let i=0;i<rects.length;i++){const a=rects[i];a.hide=false;for(let j=0;j<i;j++){const b=rects[j];if(b.hide)continue;
      if(a.x<b.x+b.w-4&&a.x+a.w-4>b.x&&a.y<b.y+b.h-2&&a.y+a.h-2>b.y){a.hide=true;break;}}}
  Object.values(N).forEach(n=>{n.el.style.opacity=n.el.dataset.op||0;n.el.style.pointerEvents=(+n.el.dataset.op>.3)?'auto':'none';});
  rects.forEach(r=>{if(r.hide){r.el.style.opacity=0;r.el.style.pointerEvents='none';}});
}
resize();
setTimeout(()=>{select(null);},0);
requestAnimationFrame(frame);
window.__atlas={N,fitIds,toggle,openPanel,closePanel,select,skip:x=>{simT+=x;}};
})();
</script>
