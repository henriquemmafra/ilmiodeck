<text x="90" y="118" text-anchor="end" fill="#e3ebf5" font-size="16" font-family="Arial,sans-serif">Vmax</text>
<line x1="100" y1="248.5" x2="667" y2="248.5" stroke="#cbd5e1" stroke-dasharray="6 7" opacity=".5"/>
