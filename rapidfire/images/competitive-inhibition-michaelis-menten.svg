<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
<title id="title">Competitive inhibition — Michaelis–Menten</title>
<desc id="desc">Competitive inhibition shifts the substrate-velocity curve to the right, increasing apparent Km while leaving Vmax unchanged.</desc>
